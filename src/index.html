<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Doces da Tassi</title>

        <link rel="stylesheet" href="./css/reset.css">
        <link rel="stylesheet" href="./css/style.css">
        <script type="module" src="./js/main.js"></script>
    </head>

    <body>
        <div class="layout">
            <header>
                <a href="#" id="logo-icon">
                    <img src="./assets/svg/logo.svg" alt="Menu"/>
                </a>
                <a href="#" id="menu-icon">
                    <img src="./assets/svg/header_menu_icon.svg" alt="Menu" />   
                </a>
            </header>
            <section id="s-hero">
                    <div id="merchan">
                        <h1>Desde 2015 transformando momentos em bolo.</h1>
                        <button type="button" id="merchan-button">
                            <span>Comemore com a gente!</span>
                            <img src="./assets/svg/whatsapp-icon.svg" alt="WhatsApp" id="whatsapp-icon" class="button-icon"/>
                            <img src="./assets/svg/arrow_right.svg" alt="Arrow Link" id="arrow-icon" class="button-icon hidden"/>
                        </button>
                    </div>
    
                    <img src="./assets/image/herodt-.png" alt="Bolo decorado com flores" id="cake_section_1"/>
            </section>
        </div>
        <div class="small-layout">
            <img src="./assets/image/s-banner-full.png" alt="Bolo decorado com folhas" id="cake_banner_full_1">
        </div>
        <div class="default-layout">
            <div id="market-info">
                <div class="card">
                    <span>R. Vereador José Marques Simões, 464</span>
                    <span>Jd. Amália, Volta Redonda</span>
                </div>  
                <div class="card">
                    <h4>Atendimento</h4>
                    <div class="work-pickup-time">
                        <span>Terça a Sexta</span>
                        <span>10h às 18h</span>
                    </div>
                    <div class="work-pickup-time">
                        <span>Sábado</span>
                        <span>10h às 15h30</span>
                    </div>
                </div>
                <div class="card">
                    <h4>Retirada</h4>
                    <div class="work-pickup-time">
                        <span>Terça a Sexta</span>
                        <span>14h30 às 18h</span>
                    </div>
                    <div class="work-pickup-time">
                        <span>Sábado</span>
                        <span>10h às 13h</span>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <footer>
    </footer>
</html>
